# Ultralytics YOLO 🚀
# 草莓專用改良架構 (Small 版本)：P2 高解析度頭 + CBAM 注意力機制
# 基於 yolo11-strawberry-p2-cbam-m.yaml 縮減而來
#
# ⚠️ 通道計算說明（width_factor=0.50, max_channels=512）：
#   原始 64  → 實際 32   (64  × 0.50)
#   原始 128 → 實際 64   (128 × 0.50)
#   原始 256 → 實際 128  (256 × 0.50)
#   原始 512 → 實際 256  (512 × 0.50)
#   原始 1024→ 實際 512  (1024× 0.50，但 max_channels=512 上限)
# ⚠️ CBAM 的 [channels] 參數必須與前一層縮放後的輸出通道數完全一致：
#   P2 Head 輸出 → 128×0.50 = 64  → CBAM[64]
#   P3 Head 輸出 → 256×0.50 = 128 → CBAM[128]
#   P4 Head 輸出 → 512×0.50 = 256 → CBAM[256]
#   P5 Head 輸出 → 1024×0.50= 512 → CBAM[512]

nc: 3

# 模型縮放係數 (以 YOLO11s 為基準)
scales:
  s: [0.50, 0.50, 1024] # [depth, width, max_channels] 強制設為 1024 防止通道被提早截斷

backbone:
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2   → 實際 ch=32
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4   → 實際 ch=64
  - [-1, 2, C3k2, [256, False, 0.25]] # 2        → 實際 ch=128
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8   → 實際 ch=128
  - [-1, 2, C3k2, [512, False, 0.25]] # 4        → 實際 ch=256
  - [-1, 1, Conv, [512, 3, 2]]        # 5-P4/16  → 實際 ch=256
  - [-1, 2, C3k2, [512, True]]        # 6        → 實際 ch=256
  - [-1, 1, Conv, [1024, 3, 2]]       # 7-P5/32  → 實際 ch=512
  - [-1, 2, C3k2, [1024, True]]       # 8        → 實際 ch=512
  - [-1, 1, SPPF, [1024, 5]]          # 9        → 實際 ch=512
  - [-1, 2, C2PSA, [1024]]            # 10       → 實際 ch=512

head:
  # ── P4 Upsample → Concat(6) ─────────────────────────────
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12: 512+256=768 → C3k2 out 256
  - [-1, 2, C3k2, [512, False]]                # 13 → 實際 ch=256

  # ── P3 Upsample → Concat(4) ─────────────────────────────
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15: 256+256=512 → C3k2 out 128
  - [-1, 2, C3k2, [256, False]]                # 16 → 實際 ch=128

  # ── P2 Upsample → Concat(2) ─────────────────────────────
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]]                  # 18: 128+128=256 → C3k2 out 64
  - [-1, 2, C3k2, [128, False]]                # 19 → 實際 ch=64

  # ── 下採樣 P2→P3 ─────────────────────────────────────────
  - [-1, 1, Conv, [256, 3, 2]]                 # 20 → 實際 ch=128
  - [[-1, 16], 1, Concat, [1]]                 # 21: 128+128=256 → C3k2 out 128
  - [-1, 2, C3k2, [256, False]]                # 22 → 實際 ch=128

  # ── 下採樣 P3→P4 ─────────────────────────────────────────
  - [-1, 1, Conv, [512, 3, 2]]                 # 23 → 實際 ch=256
  - [[-1, 13], 1, Concat, [1]]                 # 24: 256+256=512 → C3k2 out 256
  - [-1, 2, C3k2, [512, False]]                # 25 → 實際 ch=256

  # ── 下採樣 P4→P5 ─────────────────────────────────────────
  - [-1, 1, Conv, [512, 3, 2]]                 # 26 → 實際 ch=256
  - [[-1, 10], 1, Concat, [1]]                 # 27: 256+512=768 → C3k2 out 512
  - [-1, 2, C3k2, [1024, True]]                # 28 → 實際 ch=512

  # ── CBAM 注意力機制（通道數必須與前一層實際輸出完全對齊）──
  - [19, 1, CBAM, [64]]   # 29: P2 head → 128×0.50=64
  - [22, 1, CBAM, [128]]  # 30: P3 head → 256×0.50=128
  - [25, 1, CBAM, [256]]  # 31: P4 head → 512×0.50=256
  - [28, 1, CBAM, [512]]  # 32: P5 head → 1024×0.50=512（上限 max_channels=512）

  # ── 4 頭偵測（P2/P3/P4/P5）───────────────────────────────
  - [[29, 30, 31, 32], 1, Detect, [nc]]
