# Ultralytics YOLO 🚀
# 草莓專用改良架構：帶有 P2 高解析度小目標偵測頭 + CBAM 注意力機制

nc: 3 # 類別數量 (level_1, level_2, level_3)

# 模型縮放係數 (以 YOLO11s 為基準)
scales: 
  s: [0.50, 0.50, 1024] # [depth, width, max_channels]

# ==================================
# 骨幹網路 (Backbone)
# ==================================
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4  (高解析度特徵，適合微小草莓)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 (深層特徵)
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]]    # 9
  - [-1, 2, C2PSA, [1024]]      # 10 - YOLO11 特有的雙分支注意力

# ==================================
# 特徵融合頸部與注意力機制 (Neck & Attention Head)
# ==================================
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  # 🌟 核心改良 1：加入 P2 小目標專屬融合層
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-tiny) -> 專抓極小草莓

  # 以下為特徵下採樣融合 (Bottom-up)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 

  # 🌟 核心改良 2：在送入探測頭前，套用 CBAM 通道與空間注意力機制
  - [19, 1, CBAM, [64]]   # 29: 針對 P2(微小目標) 注入注意力，排除背景雜訊
  - [22, 1, CBAM, [128]]  # 30: 針對 P3(小目標) 注入注意力
  - [25, 1, CBAM, [256]]  # 31: 針對 P4(中目標) 注入注意力
  - [28, 1, CBAM, [512]]  # 32: 針對 P5(大目標) 注入注意力

  # 🌟 核心改良 3：四頭檢測 (4-Heads Detection)
  # 原本是 Detect(P3, P4, P5)，現在加入 P2 變成 4 個頭並聯
  - [[29, 30, 31, 32], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
